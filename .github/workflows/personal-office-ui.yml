name: Personal Office UI checks

on:
  push:
    branches:
      - feature/korean-personal-office
  pull_request:
    paths:
      - 'webview-ui/**'
      - '.github/workflows/personal-office-ui.yml'

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web UI
        run: npm run build:webview
      - name: Test web UI
        run: npm run test:webview
